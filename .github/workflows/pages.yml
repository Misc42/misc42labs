name: Deploy to GitHub Pages

# Public repo → GitHub Actions minutes are unlimited free, so we can run
# Next.js static-export builds on every push without billing concerns.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # next export is auto-triggered by `output: 'export'` in next.config.
      # Output lives in ./out by default. .nojekyll prevents GitHub from
      # mangling _next/ asset paths via Jekyll preprocessing.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
